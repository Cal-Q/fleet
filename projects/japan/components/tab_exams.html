<!-- tools/templates/components/tab_exams.html — Single-Question Instant-Scan Exam Runner -->
<!-- Strictly <= 200 lines invariant. -->
<section id="section-exams" class="h-full flex flex-col space-y-2 overflow-hidden select-text">
  <!-- Minimalist Command & Telemetry Strip -->
  {% include "components/tab_exams_header.html" %}

  <!-- Leaf 1: Drill Scritto — Single-Question Instant Scan Runner -->
  <div id="leaf_exam_drill" class="flex-grow flex flex-col space-y-2 overflow-hidden">
    <!-- Sub-Rail: Section Filter & Question Jump Rail -->
    <div class="flex-shrink-0 bg-white border border-black/10 p-2 space-y-2">
      <!-- Section Buttons -->
      <div class="flex flex-wrap items-center justify-between gap-1.5 font-mono text-xs">
        <div class="flex flex-wrap items-center gap-1">
          <button
            id="btn_sec_A"
            onclick="loadExam('A')"
            class="px-2.5 py-1 bg-[#181A1B] text-white font-bold uppercase
                   transition tap-press active:scale-95 shadow-2xs"
          >Parte A (12Q)</button>
          <button
            id="btn_sec_B"
            onclick="loadExam('B')"
            class="px-2.5 py-1 bg-[#FAF8F5] border border-black/10 hover:border-black
                   font-bold transition tap-press active:scale-95"
          >Parte B (12Q)</button>
          <button
            id="btn_sec_C"
            onclick="loadExam('C')"
            class="px-2.5 py-1 bg-[#FAF8F5] border border-black/10 hover:border-black
                   font-bold transition tap-press active:scale-95"
          >Parte C (8Q)</button>
          <button
            id="btn_sec_mock"
            onclick="loadExam('mock')"
            class="px-2.5 py-1 bg-[#FAF8F5] border border-black/10 hover:border-black
                   font-bold text-neutral-800 transition tap-press active:scale-95"
          >⚡ Simulazione (30Q)</button>
          <button
            id="btn_sec_all"
            onclick="loadExam('all')"
            class="px-2.5 py-1 bg-[#FAF8F5] border border-black/10 hover:border-black
                   font-bold text-neutral-600 transition tap-press active:scale-95"
          >Tutte (14Q)</button>
        </div>
        <div class="flex items-center gap-2">
          <span
            id="drillAnswerProgress"
            class="font-mono text-xs font-bold text-neutral-600"
          >0 / 0 risposte (0%)</span>
          <button
            id="btnNextBatch"
            onclick="window.loadNextBatch()"
            title="Carica una nuova batteria di domande diverse"
            class="px-2 py-0.5 border border-[#181A1B] bg-[#181A1B] text-white hover:bg-black
                   font-bold transition tap-press active:scale-95 shadow-2xs text-xs"
          >🎲 Nuove Domande</button>
          <button
            onclick="window.resetExam()"
            title="Azzera risposte e ricarica (richiede conferma)"
            class="px-2 py-0.5 border border-black/20 bg-white hover:border-black
                   text-neutral-600 font-bold transition tap-press active:scale-95 text-xs"
          >🔄 Azzera Prova</button>
        </div>
      </div>

      <!-- Quick Jump Question Progression Rail -->
      <div
        id="examQuestionRail"
        class="flex items-center gap-1 overflow-x-auto no-scrollbar pt-1 border-t border-black/5"
      ></div>
    </div>

    <!-- Main Question Focus Container (Single Question per View) -->
    <div class="flex-grow flex flex-col overflow-hidden relative">
      <div
        id="examSingleContainer"
        class="h-full flex flex-col justify-between overflow-y-auto overscroll-contain
               max-h-[calc(100vh-230px)]"
      ></div>
      <div
        id="examResultsBox"
        class="hidden h-full overflow-y-auto overscroll-contain max-h-[calc(100vh-230px)]"
      ></div>
    </div>
  </div>

  <!-- Leaf 2: Keigo Oral Interview Simulator -->
  {% include "components/tab_exams_interview.html" %}

  <!-- Leaf 3: Diagnostics & Competence Map -->
  {% include "components/tab_exams_analytics.html" %}
</section>
