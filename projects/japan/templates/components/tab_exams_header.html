<!-- templates/components/tab_exams_header.html — Exam Telemetry & Controls Header -->
<!-- Strictly <= 200 lines invariant. -->
<header
  class="flex-shrink-0 px-3 py-2 bg-white border border-black/10
         flex flex-wrap items-center justify-between gap-2"
>
  <div class="flex items-center gap-2">
    <span
      class="w-6 h-6 flex items-center justify-center bg-[#C23B22]
             text-white text-xs font-bold jp-font"
    >問</span>
    <h2
      class="text-xs md:text-sm font-bold font-editorial-serif
             uppercase text-[#181A1B] tracking-wide"
    >MEXT Exam Lab</h2>
    <!-- Branch Mode Switch Pills -->
    <nav class="flex items-center gap-1 font-mono text-xs ml-2">
      <button
        id="branch_btn_exam_drill"
        onclick="switchExamBranch('drill')"
        class="px-2.5 py-1 bg-[#181A1B] text-white font-bold
               transition tap-press active:scale-95 shadow-2xs"
      >1. Drill Scritto</button>
      <button
        id="branch_btn_exam_interview"
        onclick="switchExamBranch('interview')"
        class="px-2.5 py-1 bg-[#FAF8F5] border border-black/10 hover:border-black
               text-neutral-600 font-bold transition tap-press active:scale-95"
      >2. Orale Keigo</button>
      <button
        id="branch_btn_exam_analytics"
        onclick="switchExamBranch('analytics')"
        class="px-2.5 py-1 bg-[#FAF8F5] border border-black/10 hover:border-black
               text-neutral-600 font-bold transition tap-press active:scale-95"
      >3. 📊 Diagnostica</button>
    </nav>
  </div>

  <!-- Right Controls: Timer & Tools -->
  <div class="flex items-center gap-1.5 font-mono text-xs">
    <div class="flex items-center gap-1">
      <span
        class="px-2 py-0.5 bg-[#FAF8F5] border border-black/10 text-neutral-700 font-bold"
        id="examTimer"
      >⏱️ <span id="timeElapsed">00:00</span></span>
      <button
        type="button"
        id="btnResetTimer"
        onclick="window.confirmResetExamTimer()"
        title="Azzera timer (richiede conferma)"
        class="px-1.5 py-0.5 border border-black/20 bg-white hover:bg-neutral-100
               text-neutral-600 font-bold transition tap-press active:scale-95 text-[10px]"
      >↺ Reset</button>
    </div>
    <button
      type="button"
      id="btnToggleMissingParts"
      onclick="window.toggleMissingPartsMode()"
      title="Metti in pausa il timer e seleziona caratteri sconosciuti"
      class="px-2 py-0.5 border border-black/20 bg-white hover:border-black
             font-bold transition tap-press active:scale-95 flex items-center gap-1 text-xs"
    >
      <span>🔍</span><span id="missingPartsLabel">Parti Mancanti: OFF</span>
    </button>
    <span
      id="examPacingPill"
      class="px-2 py-0.5 border border-black/10 bg-[#FAF8F5]
             text-neutral-500 font-bold transition-all"
    >Pace: In attesa</span>
    <button
      type="button"
      id="ambientSoundToggle"
      onclick="window.toggleAmbientExamAudio()"
      title="Simulazione rumore d'aula d'esame"
      class="px-2 py-0.5 border border-black/10 bg-[#FAF8F5] text-neutral-600
             font-bold hover:border-black transition tap-press active:scale-95
             flex items-center gap-1"
    >
      <span>🎧 Aula</span><span id="ambientSoundStatus" class="text-neutral-400">OFF</span>
    </button>
    <a
      href="/api/exams/omr-sheet"
      target="_blank"
      title="Stampa foglio risposte ottico OMR A4"
      class="px-2 py-0.5 border border-black/20 bg-white hover:bg-black
             hover:text-white transition tap-press active:scale-95
             text-neutral-700 flex items-center gap-1"
    ><span>🖨️</span><span>OMR</span></a>
  </div>
</header>
