<!-- tools/templates/components/anki_header.html — Kiosk Masthead & Quick Actions -->
<!-- Strictly <= 200 lines invariant. -->
<header
  class="flex-shrink-0 bg-[#1E1E1E] text-white px-3 sm:px-4 h-14 flex items-center
  justify-between border-b border-[#2C2C2C] shadow-md z-30">
  <div class="flex items-center gap-2 min-w-0">
    <button id="ankiNavBackBtn" onclick="window.ankiShowDeckList()"
      class="hidden p-1.5 rounded-full hover:bg-white/10 transition tap-press text-neutral-300">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
      </svg>
    </button>
    <div class="flex items-center gap-1.5 min-w-0">
      <span
        class="w-6 h-6 rounded bg-[#2196F3] text-white font-mono font-bold text-xs
        flex items-center justify-center flex-shrink-0 shadow">★</span>
      <h1 id="ankiAppTitle" class="font-bold text-sm sm:text-base tracking-wide truncate">
        Japan Mastery • Mazzi
      </h1>
      <button id="ankiHeaderVersionBtn" onclick="window.ankiOpenUpdateModal()"
        class="px-1.5 py-0.2 rounded bg-emerald-500/20 hover:bg-emerald-500/30
        text-emerald-400 border border-emerald-500/40 text-[10px] font-mono font-bold
        flex-shrink-0 transition tap-press"
        title="Controlla Aggiornamenti OTA">v2.9.0</button>
    </div>
  </div>
  <div class="flex items-center gap-1 font-mono text-xs flex-shrink-0">
    <div id="ankiNeuralStatusPill" title="Stato Modello Neurale TPU"
      class="flex items-center gap-1 bg-[#121212] border border-[#2C2C2C] rounded-full
      px-2 py-0.5 text-[11px] shadow-inner select-none">
      <span id="ankiNeuralStatusIcon">⌛</span>
      <span id="ankiNeuralStatusText" class="text-neutral-500 text-[10px]">AI</span>
    </div>
    <div id="ankiTopDuePill"
      class="hidden flex items-center bg-[#121212] border border-[#2C2C2C]
      rounded-full px-2 py-0.5 text-[11px] gap-1.5 shadow-inner">
      <span id="ankiCountNew" class="text-[#42A5F5] font-bold">0</span>
      <span id="ankiCountLrn" class="text-[#EF5350] font-bold">0</span>
      <span id="ankiCountRev" class="text-[#66BB6A] font-bold">0</span>
    </div>
    <button onclick="window.ankiUndo()"
      class="p-1.5 rounded-full hover:bg-white/10 text-neutral-300 transition tap-press"
      title="Annulla Ultima Carta (Z / Swipe Giù)">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 10h10a5 5 0 015 5v2a5 5 0 01-5 5H6m-3-12l4-4m-4 4l4 4"/>
      </svg>
    </button>
    <button onclick="window.ankiOpenUpdateModal()"
      class="p-1.5 rounded-full hover:bg-white/10 text-neutral-300 transition tap-press"
      title="Aggiornamenti & Versione">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581
          m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
    </button>
    <button onclick="window.ankiToggleLogViewer()"
      class="p-1.5 rounded-full hover:bg-white/10 text-neutral-300 transition tap-press"
      title="Registro Diagnostico / Debug">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293
          l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
    </button>
    <button onclick="window.ankiToggleSettings()"
      class="p-1.5 rounded-full hover:bg-white/10 text-neutral-300 transition tap-press"
      title="Impostazioni">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066
          c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756
          2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37
          a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724
          0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572
          c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826
          -3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
    </button>
  </div>
</header>
<div id="ankiGlobalUpdateBanner"
  class="hidden bg-[#1E88E5] text-white px-3 py-1 text-xs font-mono flex items-center
  justify-between shadow-md z-40 border-b border-blue-400/30">
  <span id="ankiGlobalUpdateText" class="flex items-center gap-1.5 truncate"></span>
  <button type="button"
    onclick="document.getElementById('ankiGlobalUpdateBanner').classList.add('hidden')"
    class="text-white/80 hover:text-white text-xs font-bold ml-2 tap-press">✕</button>
</div>
